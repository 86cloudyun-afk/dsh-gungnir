name: ci

on:
  push:
    branches: [main, 'pr/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 验收套件（零依赖）
        run: node --test
      - name: 工具 schema 严格校验
        run: node scripts/validate-tool-schemas.mjs
      - name: 预设允许清单校验
        run: node scripts/check-preset.mjs
      - name: 故障注入矩阵
        run: node scripts/fault-matrix.mjs
      - name: 工具文档同步
        run: node scripts/gen-docs.mjs --check
      - name: 自审闸（秘密/链接/验收引用/卫生）
        run: node scripts/self-review.mjs
